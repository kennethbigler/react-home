# ... previous config options...

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0.1%  # allow up to 0.1% drop before failing (covers indirect changes from dep updates)
    patch:
      default:
        target: auto

comment:
  layout: "header, diff, flags, components"  # show component info in the PR comment

component_management:
  default_rules:
    statuses: []  # sub-components stay in PR comment/UI only; no GitHub checks
  individual_components:
    - component_id: module_games  # ⚠️ ID, do not change
      name: 🕹️ Games  # display name, change freely
      paths:
        - src/components/games/**
      statuses:
        - type: project
          target: auto
          threshold: 0.1%
          branches:
            - "!main"
    - component_id: module_games_blackjack
      name: Blackjack
      paths:
        - src/components/games/blackjack/**
    - component_id: module_games_botc
      name: BotC
      paths:
        - src/components/games/botc/**
