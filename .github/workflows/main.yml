name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Node project
        uses: ./.github/actions/setup-node
      - name: Run linters
        run: npm run lint:q
      - name: Run knip
        run: npm run knip -- --reporter github-actions --cache
      - name: Build
        run: npm run build
      - name: Run lighthouse
        run: npm run lhci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 20
          persist-credentials: false
      - name: Setup Node project
        uses: ./.github/actions/setup-node
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Codecov
        uses: codecov/codecov-action@v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Live-site scan after a merge to main (and manual runs on main). Runs on PR merge.
  accessibility:
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && contains(fromJSON('["push","workflow_dispatch"]'), github.event_name)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node project
        uses: ./.github/actions/setup-node
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build site
        run: npm run build
      # Scan the built revision from this workflow run (vite preview)
      - name: Run hydration-aware accessibility scan
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          PREVIEW_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          node scripts/a11y-live-scan.mjs --base-url http://127.0.0.1:4173
          kill "$PREVIEW_PID"
      # Wait for the route heading so axe scans hydrated content
      - name: accessibility-scanner
        uses: github/accessibility-scanner@v3.5.0
        with:
          url_configs: |
            [
              {"url":"https://www.kennethbigler.com/","waitForSelectors":["#main-content h1"]},
              {"url":"https://www.kennethbigler.com/experience","waitForSelectors":["#main-content h1"]},
              {"url":"https://www.kennethbigler.com/resume","waitForSelectors":["#main-content h1"]},
              {"url":"https://www.kennethbigler.com/f1","waitForSelectors":["#main-content h1"]},
              {"url":"https://www.kennethbigler.com/cars","waitForSelectors":["#main-content h1"]},
              {"url":"https://www.kennethbigler.com/finances","waitForSelectors":["#main-content h1"]},
              {"url":"https://www.kennethbigler.com/travel","waitForSelectors":["#main-content h1"]},
              {"url":"https://www.kennethbigler.com/games","waitForSelectors":["#main-content h1"]},
              {"url":"https://www.kennethbigler.com/games/botc","waitForSelectors":["#main-content h1"]},
              {"url":"https://www.kennethbigler.com/games/murder","waitForSelectors":["#main-content h1"]},
              {"url":"https://www.kennethbigler.com/games/werewolf","waitForSelectors":["#main-content h1"]},
              {"url":"https://www.kennethbigler.com/games/bridge","waitForSelectors":["#main-content h1"]},
              {"url":"https://www.kennethbigler.com/games/imperial-assault","waitForSelectors":["#main-content h1"]},
              {"url":"https://www.kennethbigler.com/games/spades","waitForSelectors":["#main-content h1"]},
              {"url":"https://www.kennethbigler.com/games/types","waitForSelectors":["#main-content h1"]},
              {"url":"https://www.kennethbigler.com/games/blackjack","waitForSelectors":["#main-content h1"]},
              {"url":"https://www.kennethbigler.com/games/deal","waitForSelectors":["#main-content h1"]},
              {"url":"https://www.kennethbigler.com/games/poker","waitForSelectors":["#main-content h1"]},
              {"url":"https://www.kennethbigler.com/games/slots","waitForSelectors":["#main-content h1"]},
              {"url":"https://www.kennethbigler.com/games/yahtzee","waitForSelectors":["#main-content h1"]},
              {"url":"https://www.kennethbigler.com/games/connect4","waitForSelectors":["#main-content h1"]},
              {"url":"https://www.kennethbigler.com/games/tictactoe","waitForSelectors":["#main-content h1"]}
            ]
          repository: kennethbigler/react-home
          token: ${{ secrets.A11Y_SCANNER_TOKEN }}
          cache_key: cached_results-kennethbigler.com-main.json
          scans: |
            ["axe", {"name": "alt-text-scan", "package": "@github/accessibility-scanner-alt-text-plugin", "version": "1.1.0"}]

  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.2
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.2
