# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: assertive
  request_changes_workflow: true
  path_filters:
    - "!docs/**"
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
    ignore_usernames:
      - "dependabot[bot]"
  path_instructions:
    - path: "src/**/*.{ts,tsx}"
      instructions: |
        Target WCAG 2.2 Level AA. See .cursor/rules/a11y-checklist.mdc for full project
        standards. In changed UI code, flag:
        - Missing or empty alt on meaningful images; decorative images should use alt=""
        - Interactive elements not reachable by keyboard (div/span with onClick only)
        - Icon-only controls missing aria-label or aria-labelledby
        - Form fields without programmatic labels (htmlFor/id or aria-labelledby)
        - Modals/dialogs without focus management or aria-modal
        - Dynamic status updates without aria-live (score, turn, phase, errors)
        - Focus management when phase, modal, or view state changes
        - Custom controls missing accessible name, role, and state (aria-*)
        - Drag-only or click-only interactions with no keyboard alternative
        - Hardcoded colors instead of theme.palette tokens (contrast risk)
        Prefer MUI components for built-in ARIA and keyboard behavior. Also prioritize
        React correctness and meaningful test coverage for changed behavior.
    - path: "src/**/*.test.{ts,tsx}"
      instructions: |
        For changed interactive components, suggest accessibility test coverage when
        missing (e.g. jest-axe toHaveNoViolations, keyboard interaction tests, role/name
        queries). For stateful or game-like UIs, include keyboard operability and
        aria-live announcement tests where status changes matter. Prefer semantic
        Testing Library queries (getByRole, getByLabelText).
